<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Riley Arsenault | Home</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #4fb884;
            overflow: hidden;
        }

        /* Moving squares */
        .square {
            position: absolute;
            background-color: #1f5e3c;
            filter: blur(14px);
            opacity: 0.7;
            border-radius: 8px;
        }

        /* Center text */
        .center-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            background-color: #7fbfa1;
            padding: 22px;
            width: 360px;
            text-align: center;
            border-radius: 16px;
            color: #0f3d27;
            z-index: 10;
        }

        /* Circle button */
        .circle-link {
            position: absolute;
            top: calc(50% + 95px);
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            background-color: #e5f6ee;
            color: #1f5e3c;
            border-radius: 50%;
            text-align: center;
            line-height: 72px;
            font-weight: bold;
            text-decoration: none;
            z-index: 10;
            transition: 0.3s;
        }

        .circle-link:hover {
            background-color: white;
        }
    </style>
</head>

<body>

    <div id="mosaic"></div>

    <div class="center-box">
        <h2>Riley Arsenault</h2>
        <p>
            Grade 10 student at Frontenac Secondary School taking
            Communication Technology and learning digital media and design.
        </p>
    </div>

    <!-- FIXED LINK -->
    <a href="projects.html" class="circle-link">Go</a>

    <script>
        const mosaic = document.getElementById("mosaic");
        const count = 25;

        for (let i = 0; i < count; i++) {
            const sq = document.createElement("div");
            sq.classList.add("square");

            const size = Math.random() * 120 + 60;
            sq.style.width = size + "px";
            sq.style.height = size + "px";

            let x = Math.random() * window.innerWidth;
            let y = Math.random() * window.innerHeight;

            sq.style.left = x + "px";
            sq.style.top = y + "px";

            let dx = (Math.random() - 0.5) * 0.4;
            let dy = (Math.random() - 0.5) * 0.4;

            mosaic.appendChild(sq);

            function move() {
                x += dx;
                y += dy;

                if (x < -200 || x > window.innerWidth) dx *= -1;
                if (y < -200 || y > window.innerHeight) dy *= -1;

                sq.style.left = x + "px";
                sq.style.top = y + "px";

                requestAnimationFrame(move);
            }

            move();
        }
    </script>

</body>
</html>
